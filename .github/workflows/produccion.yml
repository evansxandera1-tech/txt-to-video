- name: Generar videos en lote (texto de Drive + gameplay) + subir a Drive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import logging
          import os
          import time
          import hsf_engine
          from hsf_engine import (
              procesar_todo, _elegir_texto_desde_drive, _marcar_texto_usado_en_drive,
              _elegir_gameplay_desde_drive,
              _subir_ultimo_resultado_a_drive, ESTADO, CANDADO_ESTADO, CARPETA_VIDEOS,
              FUENTE_POR_DEFECTO, VELOCIDAD_VOZ_POR_DEFECTO, TONO_VOZ_POR_DEFECTO,
              VELOCIDAD_EFECTO_POR_DEFECTO,
          )

          logger = logging.getLogger("produccion")
          logger.addHandler(logging.StreamHandler())
          logger.setLevel(logging.INFO)

          TIEMPO_LIMITE_SEGUNDOS = 320 * 60  # margen de ~40 min antes del limite de 6h del job
          inicio = time.time()
          contador_videos = 0

          while True:
              if time.time() - inicio >= TIEMPO_LIMITE_SEGUNDOS:
                  logger.info(f"Limite de tiempo alcanzado. Total generado: {contador_videos} videos.")
                  break

              guion, nombre_archivo_texto = _elegir_texto_desde_drive(logger=logger)
              if not guion:
                  logger.info(f"No quedan textos listos en Drive. Total generado: {contador_videos} videos.")
                  break

              ruta_gameplay = _elegir_gameplay_desde_drive(logger=logger)
              if not ruta_gameplay:
                  logger.info(f"No hay gameplay disponible. Total generado: {contador_videos} videos.")
                  break

              logger.info(f"--- Generando video #{contador_videos + 1} ({nombre_archivo_texto}) ---")

              try:
                  procesar_todo(
                      guion, 3, "centro", "oro_viejo", 42, FUENTE_POR_DEFECTO, "piano", 12, [], "dinamico",
                      False, False, VELOCIDAD_VOZ_POR_DEFECTO, TONO_VOZ_POR_DEFECTO,
                      opacidad_sub=100, cantidad_imagenes_descargar=0, ancho_sub_pct=73, pos_y_pct=50,
                      efecto_video="ninguno", velocidad_efecto=VELOCIDAD_EFECTO_POR_DEFECTO,
                      fondo_gameplay=True, ruta_gameplay=ruta_gameplay,
                      logger=logger, ruta_log=None,
                  )

                  with CANDADO_ESTADO:
                      resultado = dict(ESTADO.get("resultado") or {})
                  if not resultado.get("video"):
                      raise RuntimeError(f"El pipeline de video fallo: {resultado.get('mensaje', 'sin detalle')}")

                  ruta_video_absoluta = os.path.join(CARPETA_VIDEOS, resultado["video"])
                  logger.info(f"Video generado en: {ruta_video_absoluta}")

                  hsf_engine._ULTIMO_RESULTADO_AUTOMATICO = {
                      "ruta_video": ruta_video_absoluta,
                      "titulo_resumen": resultado.get("titulo") or "Video generado automaticamente",
                      "subreddits": [],
                      "cantidad_historias": 1,
                      "carpeta_proyecto": os.path.dirname(ruta_video_absoluta),
                  }

                  logger.info("Subiendo video a Drive (puede tardar varios minutos sin mostrar progreso)...")
                  _subir_ultimo_resultado_a_drive(logger)
                  logger.info("Subida a Drive completada.")

                  _marcar_texto_usado_en_drive(nombre_archivo_texto, logger=logger)
                  logger.info(f"Texto marcado como usado. Total hasta ahora: {contador_videos + 1} videos.")
                  contador_videos += 1

              except Exception as e:
                  logger.error(f"Fallo generando video con texto '{nombre_archivo_texto}': {e}")
                  break

          logger.info(f"Produccion en lote terminada. Total: {contador_videos} videos generados.")
          if contador_videos == 0:
              raise RuntimeError("No se genero ningun video en esta corrida.")
          PYEOF
